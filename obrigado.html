  <style>
    .ty-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Orb de fundo */
    .ty-orb {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(240,76,35,.13) 0%, transparent 65%);
      filter: blur(80px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .ty-box {
      position: relative;
      text-align: center;
      max-width: 520px;
      z-index: 2;
    }

    .ty-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(240,76,35,.12);
      border: 1px solid rgba(240,76,35,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      color: var(--orange);
    }

    .ty-label {
      font-family: 'BrunoAce', 'Ubuntu', sans-serif;
      font-size: 11px;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: .16em;
      margin-bottom: 16px;
    }

    .ty-title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.025em;
      margin-bottom: 16px;
    }

    .ty-sub {
      font-size: 17px;
      color: var(--text-2);
      font-weight: 300;
      line-height: 1.75;
      margin-bottom: 40px;
    }

    .ty-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .ty-footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--text-3);
    }
  </style>
</head>
